# generated by hotdogwerx-devkit-workspace@0.1.0 - manual changes may be overwritten
name: ci-checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  repo-checks:
    uses: hotdog-werx/devkit/.github/workflows/__workspace_repo-checks.yaml@0de802099634a9675c03f564ad0b84711c709693
    with:
      enable-docs: true

  ## start-custom-ci-checks
  # OS-independent checks run once. Windows checkouts use CRLF, which the
  # formatter and the bundle drift check would misreport.
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build
      - run: git ls-files --error-unmatch dist/index.cjs dist/index.cjs.LEGAL.txt
      - run: git diff --exit-code -- dist/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          cache: npm
      - run: npm ci
      - name: Install coverage.py for integration tests
        run: |
          # Windows venvs use Scripts/python.exe, and python3 there can be the
          # Microsoft Store stub.
          if [[ "$RUNNER_OS" == Windows ]]; then python=python; bin=Scripts; else python=python3; bin=bin; fi
          "$python" -m venv "$RUNNER_TEMP/mustard-python"
          "$RUNNER_TEMP/mustard-python/$bin/python" -m pip install -r tests/fixtures/requirements.txt
          echo "$RUNNER_TEMP/mustard-python/$bin" >> "$GITHUB_PATH"
      - run: npm run coverage
      - uses: ./
        if: always() && !cancelled() && hashFiles('lcov.info') != ''
        with:
          mode: upload
          files: lcov.info
          shard: ${{ runner.os }}

  test-action:
    uses: ./.github/workflows/action-tests.yaml
    permissions:
      contents: read

  coverage:
    needs: [test]
    if: always() && !cancelled() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          # Mustard's verdicts are check runs, not jobs. Fail this job on a
          # failed coverage check so checks-complete sees it.
          fail-ci: 'true'

  coverage-default:
    needs: [test]
    if: always() && !cancelled() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          fail-ci: 'true'

  # The single required check for rulesets. It fails if any job it needs
  # failed or was cancelled.
  checks-complete:
    needs: [repo-checks, checks, test, test-action, coverage, coverage-default]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: hotdog-werx/checks-complete-action@3c9b8daa70459d2e906d4c8c8926b3c599430e12 # 0.1.1
        with:
          needs-jobs: ${{ toJSON(needs) }}
  ## end-custom-ci-checks
