name: Finalize release

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: mustard-release

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml

      - name: Check the release branch and package version
        id: version
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          version="${RELEASE_BRANCH#release/}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a release/x.y.z branch." >&2
            exit 1
          fi
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import pkg from './package.json' with { type: 'json' }
          import lock from './package-lock.json' with { type: 'json' }
          const version = process.env.RELEASE_BRANCH.slice('release/'.length)
          assert.equal(pkg.version, version, 'package.json version must match the release branch')
          assert.equal(lock.version, version, 'package-lock.json version must match the release branch')
          assert.equal(lock.packages[''].version, version, 'The lockfile root version must match the release branch')
          JS
          printf 'branch=release/%s\nversion=%s\nasset=%s/mustard-v%s.zip\n' \
            "$version" "$version" "$RUNNER_TEMP" "$version" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run test:action
      - run: git ls-files --error-unmatch dist/index.cjs dist/index.cjs.LEGAL.txt
      - run: git diff --exit-code -- dist/

      - name: Package the action from the merge commit
        shell: bash
        env:
          ASSET: ${{ steps.version.outputs.asset }}
        run: git archive --format=zip --output="$ASSET" HEAD action.yml dist README.md CHANGELOG.md docs mustard.schema.json

      - name: Attest the action ZIP
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.version.outputs.asset }}

      - name: Finalize with Releez
        id: releez
        uses: hotdog-werx/releez@db0a71d48b9c39f6d7dc415d01f0b6ad21a7ecce # 1.1.1
        with:
          mode: finalize
          branch: ${{ steps.version.outputs.branch }}
          alias-versions: major

      - name: Publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.releez.outputs.release-version }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.releez.outputs.release-notes }}
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          [[ "$TAG" == "$VERSION" ]]
          notes_file="$RUNNER_TEMP/mustard-release-notes.md"
          printf '%s\n' "$NOTES" > "$notes_file"
          if state=$(gh release view "$TAG" --json isDraft,assets); then
            if ! jq -e '.isDraft' <<< "$state" > /dev/null; then
              jq -e --arg name "${ASSET##*/}" 'any(.assets[]; .name == $name)' <<< "$state" > /dev/null
              exit 0
            fi
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --draft --verify-tag --title "$TAG" --notes-file "$notes_file"
          fi
          gh release edit "$TAG" --draft=false
